# ── 这台设备上构建的内存预算（实测教训，别随手改大）──────────────────────
# 原来 Gradle 守护进程 -Xmx3072m 实测 RSS 涨到 2.3 GB，Kotlin 守护进程 -Xmx2048m 再吃 0.8 GB，
# 构建结束它们都不退出 → 常驻 3 GB，把 23 GB 的机器压到只剩 500 MB 可用。
# 现在：Gradle 2 GB 封顶 + Kotlin 编译器改 in-process（不再单独起第二个 JVM）+ 空闲 5 分钟自退。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
# 空闲 5 分钟就退出（默认 3 小时！）
org.gradle.daemon.idletimeout=300000
# 编译器跑在 Gradle 守护进程里，省一个 ~800 MB 的 Kotlin 守护进程
kotlin.compiler.execution.strategy=in-process
# 万一回落成守护进程编译，也压住它的堆
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
android.nonTransitiveRClass=true
# 官方 aapt2 是 x86-64，这里替换成设备上原生 arm64 构建
android.aapt2FromMavenOverride=/opt/termux-aapt2/bin/aapt2
android.suppressUnsupportedCompileSdk=37
